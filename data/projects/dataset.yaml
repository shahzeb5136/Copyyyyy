id: projects
name: PMO · Project Portfolio
icon: "📅"
description: >
  The IT project portfolio of the fictional company Northstar Technologies -
  projects with budgets, schedules and health, their phase-by-phase task plans,
  and the delivery team with hourly rates.
as_of_date: "2026-09-30"
currency: USD

tables:
  - name: projects
    file: projects.csv
    description: One row per project in the portfolio.
    columns:
      - name: project_id
        type: text
        description: Unique project identifier, e.g. PRJ-007. Primary key; joins to tasks.project_id.
      - name: project_name
        type: text
        description: Project name, e.g. Data Warehouse Modernization.
      - name: portfolio
        type: text
        description: >
          Strategic portfolio the project belongs to - Digital Transformation, Customer Experience,
          Data & Analytics, Infrastructure & Security, Compliance.
      - name: sponsor_department
        type: text
        description: Business department sponsoring (funding) the project.
      - name: project_manager_id
        type: text
        description: member_id of the project manager. Foreign key to team_members.member_id.
      - name: priority
        type: text
        description: Business priority - High, Medium or Low.
      - name: status
        type: text
        description: Lifecycle status - Not Started, In Progress, On Hold, Completed.
      - name: health
        type: text
        description: >
          RAG health for active work - On Track (green), At Risk (amber), Off Track (red);
          'Closed' for completed, 'On Hold' / 'Not Started' otherwise.
      - name: start_date
        type: date
        description: Project start date (planned; actual for started projects).
      - name: planned_end_date
        type: date
        description: Baseline (originally approved) end date.
      - name: forecast_end_date
        type: date
        description: Currently forecast end date for projects that are not completed. NULL when completed.
      - name: actual_end_date
        type: date
        description: Date the project actually finished. NULL unless status = 'Completed'.
      - name: budget_usd
        type: decimal
        description: Total approved budget in US dollars (labour + vendor costs + contingency).
      - name: actual_cost_usd
        type: decimal
        description: Cost incurred to date in US dollars (labour + vendor spend).
      - name: percent_complete
        type: integer
        description: Overall progress 0-100, weighted by estimated task hours.

  - name: tasks
    file: tasks.csv
    description: One row per task or milestone in a project plan. Tasks run in phase order.
    columns:
      - name: task_id
        type: text
        description: Unique task identifier, e.g. T0042.
      - name: project_id
        type: text
        description: Project the task belongs to. Foreign key to projects.project_id.
      - name: task_name
        type: text
        description: Short task name, e.g. User acceptance testing, Go-live.
      - name: phase
        type: text
        description: Delivery phase, in order - Initiation, Planning, Design, Build, Testing, Deployment, Closure.
      - name: assignee_id
        type: text
        description: member_id of the task owner. Foreign key to team_members.member_id.
      - name: start_date
        type: date
        description: Planned (baseline) start date of the task.
      - name: due_date
        type: date
        description: Planned (baseline) finish date of the task.
      - name: completed_date
        type: date
        description: Date the task was actually completed. NULL if not completed.
      - name: status
        type: text
        description: Not Started, In Progress, Blocked, or Completed.
      - name: percent_complete
        type: integer
        description: Task progress 0-100.
      - name: estimated_hours
        type: decimal
        description: Planned effort in hours for the whole task team.
      - name: actual_hours
        type: decimal
        description: Effort logged to date in hours.
      - name: is_milestone
        type: boolean
        description: True for zero-duration milestones (e.g. Design sign-off, Go-live).

  - name: team_members
    file: team_members.csv
    description: One row per person on the delivery team (internal staff assigned to projects).
    columns:
      - name: member_id
        type: text
        description: Unique team member identifier, e.g. TM05. Primary key.
      - name: full_name
        type: text
        description: Team member's full name (synthetic).
      - name: role
        type: text
        description: >
          Delivery role - Project Manager, Business Analyst, Solution Architect, Developer,
          Data Engineer, QA Engineer, UX Designer, Change Manager.
      - name: home_department
        type: text
        description: Department the person reports into.
      - name: hourly_rate_usd
        type: decimal
        description: Internal charge-out rate in US dollars per hour, used to cost labour.
      - name: weekly_capacity_hours
        type: integer
        description: Hours per week the person is available for project work.

business_definitions:
  - "Treat the as-of date (2026-09-30) as 'today' for anything relative to now (overdue, upcoming, this year)."
  - "Active projects = status IN ('In Progress', 'On Hold')."
  - "Overdue task = due_date < as-of date AND status <> 'Completed'."
  - "Budget variance (USD) = actual_cost_usd - budget_usd; budget utilisation % = actual_cost_usd / budget_usd."
  - "Schedule slip (days) = COALESCE(actual_end_date, forecast_end_date) - planned_end_date."
  - "Effort variance % = (actual_hours - estimated_hours) / estimated_hours, for completed tasks."
  - "Labour cost of a task = actual_hours * the assignee's hourly_rate_usd."

example_questions:
  - Show a timeline of all active projects.
  - Which projects are over budget or forecast to slip, and by how much?
  - Show the task schedule for the Data Warehouse Modernization project.
  - How many overdue tasks does each project manager have?
  - What is budget utilisation by portfolio?
  - Which completed tasks took the most hours over estimate?
