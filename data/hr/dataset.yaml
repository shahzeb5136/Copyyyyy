id: hr
name: HR · People Analytics
icon: "👥"
description: >
  Employee master data (current and former employees) with job, location,
  compensation and performance, department headcount plans, and leave records
  from January 2025 for the fictional company Northstar Technologies.
as_of_date: "2026-09-30"
currency: USD

tables:
  - name: departments
    file: departments.csv
    description: One row per department, including the approved headcount plan for 2026.
    columns:
      - name: department_id
        type: text
        description: Unique department identifier, e.g. D04. Primary key; joins to employees.department_id.
      - name: department_name
        type: text
        description: Department name, e.g. Engineering, Sales, Customer Success.
      - name: division
        type: text
        description: Higher-level grouping - Go-to-Market, Product & Engineering, or General & Administrative.
      - name: department_head
        type: text
        description: Name of the department's executive leader.
      - name: cost_center
        type: text
        description: Finance cost center code for the department.
      - name: approved_headcount_2026
        type: integer
        description: Number of positions (filled + open) approved in the 2026 workforce plan.

  - name: employees
    file: employees.csv
    description: >
      One row per person ever employed (active and terminated). Salary, rating and job
      fields reflect the latest known values.
    columns:
      - name: employee_id
        type: text
        description: Unique employee identifier, e.g. E1042. Primary key.
      - name: first_name
        type: text
        description: Employee's first name (synthetic).
      - name: last_name
        type: text
        description: Employee's last name (synthetic).
      - name: department_id
        type: text
        description: Department the employee belongs to. Foreign key to departments.department_id.
      - name: job_title
        type: text
        description: Current (or last) job title, e.g. Senior Software Engineer, Manager, Sales.
      - name: job_level
        type: text
        description: >
          Career level from L1 (entry) to L7 (VP). L1-L4 are individual contributors, L5 Manager,
          L6 Director, L7 VP. Sort by the number after 'L'.
      - name: is_people_manager
        type: boolean
        description: True if the employee manages other people (levels L5-L7).
      - name: employment_type
        type: text
        description: Full-time, Part-time or Contractor.
      - name: work_location
        type: text
        description: Office the employee is based in - Dubai (HQ), London, New York, Singapore, or Remote.
      - name: hire_date
        type: date
        description: Date the employee started.
      - name: termination_date
        type: date
        description: Last day of employment. NULL for active employees.
      - name: termination_type
        type: text
        description: Voluntary (employee chose to leave) or Involuntary (company decision). NULL if active.
      - name: termination_reason
        type: text
        description: >
          Primary exit reason, e.g. Better opportunity, Compensation, Relocation, Career change,
          Work-life balance (voluntary) or Performance, Restructuring, Contract ended (involuntary). NULL if active.
      - name: employment_status
        type: text
        description: Active or Terminated as of the as-of date.
      - name: base_salary_usd
        type: decimal
        description: Annual base salary in US dollars (part-time salaries are already pro-rated).
      - name: performance_rating
        type: integer
        description: >
          Latest annual performance rating, 1 (does not meet) to 5 (exceptional); 3 = meets expectations.
          NULL for employees hired after 2026-03-31 who have not been through a review cycle.
      - name: last_promotion_date
        type: date
        description: Date of the employee's most recent promotion. NULL if never promoted.
      - name: manager_id
        type: text
        description: employee_id of the person's direct manager (self-join to employees.employee_id). NULL for VPs.

  - name: leave_records
    file: leave_records.csv
    description: One row per leave request taken between 2025-01-01 and the as-of date.
    columns:
      - name: leave_id
        type: text
        description: Unique leave record identifier.
      - name: employee_id
        type: text
        description: Employee who took the leave. Foreign key to employees.employee_id.
      - name: leave_type
        type: text
        description: Annual leave, Sick leave, Parental leave, Unpaid leave or Bereavement.
      - name: start_date
        type: date
        description: First day of the leave.
      - name: end_date
        type: date
        description: Last day of the leave.
      - name: working_days
        type: integer
        description: Number of working days (Mon-Fri) taken.

business_definitions:
  - "Headcount = number of employees with employment_status = 'Active' (as of the as-of date)."
  - "Headcount at a past date D = employees with hire_date <= D and (termination_date IS NULL OR termination_date > D)."
  - "Attrition rate for a period = terminations in the period / average headcount over the period. Voluntary attrition counts only termination_type = 'Voluntary'."
  - "Open positions (vacancies) = approved_headcount_2026 - current active headcount for the department."
  - "Tenure (years) = (termination_date, or the as-of date if active) - hire_date, in years."
  - "New hires in a period = employees whose hire_date falls in the period."

example_questions:
  - What's our current headcount by department and location?
  - What was voluntary attrition by department in 2025?
  - Show average base salary by job level.
  - How many people did we hire each quarter since 2024?
  - Which departments are below their approved 2026 headcount?
  - How many sick days were taken per department in 2026?
