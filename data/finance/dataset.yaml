id: finance
name: Finance · Budget vs Actuals
icon: "💰"
description: >
  Monthly operating-expense budget vs actual spend by department and expense
  category, plus monthly revenue targets vs actuals by region and product line,
  for the fictional company Northstar Technologies (FY2025 – FY2026).
as_of_date: "2026-09-30"
currency: USD

tables:
  - name: departments
    file: departments.csv
    description: One row per department (cost-owning organisational unit).
    columns:
      - name: department_id
        type: text
        description: Unique department identifier, e.g. D04. Primary key; joins to budget_actuals.department_id.
      - name: department_name
        type: text
        description: Human-readable department name, e.g. Engineering, Sales, Marketing.
      - name: division
        type: text
        description: Higher-level grouping of departments - Go-to-Market, Product & Engineering, or General & Administrative.
      - name: department_head
        type: text
        description: Name of the executive accountable for the department's budget.
      - name: cost_center
        type: text
        description: General-ledger cost center code the department books spend against.

  - name: budget_actuals
    file: budget_actuals.csv
    description: >
      Operating expenses at monthly grain - one row per month, department and expense
      category with the approved budget and the actual booked spend.
    columns:
      - name: period_month
        type: date
        description: First day of the accounting month the row refers to (e.g. 2026-03-01 = March 2026).
      - name: fiscal_year
        type: integer
        description: Fiscal year. The fiscal year equals the calendar year (January - December).
      - name: fiscal_quarter
        type: text
        description: Fiscal quarter label Q1-Q4 within the fiscal year.
      - name: department_id
        type: text
        description: Department that owns the spend. Foreign key to departments.department_id.
      - name: expense_category
        type: text
        description: >
          Type of operating expense - Salaries & Wages, Benefits, Contractors, Software & Subscriptions,
          Travel & Entertainment, Facilities, Training & Development, Hardware & Equipment, Marketing Programs.
      - name: budget_usd
        type: decimal
        description: Approved budget for the month in US dollars. Budgets exist for all 24 months of FY2025-FY2026.
      - name: actual_usd
        type: decimal
        description: >
          Actual spend booked in US dollars. NULL for months whose books are not yet closed
          (period_status = 'Open', i.e. Oct-Dec 2026).
      - name: period_status
        type: text
        description: Closed when the month's books are final and actuals are available; Open for future months.

  - name: revenue
    file: revenue.csv
    description: Monthly revenue target vs actual by sales region and product line.
    columns:
      - name: period_month
        type: date
        description: First day of the month the revenue was recognised in.
      - name: fiscal_year
        type: integer
        description: Fiscal year (same as calendar year).
      - name: fiscal_quarter
        type: text
        description: Fiscal quarter label Q1-Q4.
      - name: region
        type: text
        description: Sales region - North America, Europe, Middle East & Africa, Asia Pacific.
      - name: product_line
        type: text
        description: Product line - Cloud Platform, Analytics Suite, Professional Services, Support & Maintenance.
      - name: target_usd
        type: decimal
        description: Revenue target (quota) for the month in US dollars.
      - name: actual_usd
        type: decimal
        description: Recognised revenue in US dollars. NULL for open (future) months.
      - name: deals_closed
        type: integer
        description: Number of deals closed in the month. NULL for open months.
      - name: period_status
        type: text
        description: Closed when actuals are final; Open for future months.

business_definitions:
  - "Variance (USD) = actual_usd - budget_usd. Positive variance means OVER budget (overspend)."
  - "Variance % = (actual_usd - budget_usd) / budget_usd."
  - "Compare budget with actuals only for closed periods (period_status = 'Closed'), otherwise open months inflate the budget side."
  - "YTD (year-to-date) for FY2026 means January-September 2026, the closed months."
  - "Remaining budget for a year = full-year budget_usd minus actual_usd spent so far."
  - "Revenue attainment % = actual_usd / target_usd for closed periods."
  - "Average deal size = revenue actual_usd / deals_closed."

example_questions:
  - What's the FY2025 budget vs actual spend by department?
  - Which expense categories are most over budget in 2026 YTD?
  - Show Engineering's monthly actual spend vs budget for 2026.
  - How much of the FY2026 budget is left for each department?
  - What is revenue attainment vs target by region for 2026 YTD?
  - Break down 2025 revenue by region and product line.
