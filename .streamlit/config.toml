[theme]
base = "light"
primaryColor = "#2a6fdb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7fa"
textColor = "#1f2937"
linkColor = "#2a6fdb"
borderColor = "#e3e6eb"
showWidgetBorder = true
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap, monospace"
headingFontWeights = [700, 650, 600, 600, 600, 600]
codeBackgroundColor = "#f6f8fb"
dataframeHeaderBackgroundColor = "#f6f8fb"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]

[theme.sidebar]
backgroundColor = "#f7f8fb"
secondaryBackgroundColor = "#ffffff"
borderColor = "#e3e6eb"

[server]
maxUploadSize = 50
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "type"
